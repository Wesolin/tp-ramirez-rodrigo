<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Buscador de personajes</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header class="encabezado">
      <h1>Buscador de personajes</h1>
      <p>Datos obtenidos en tiempo real de la API pública de Rick and Morty.</p>
    </header>

    <main class="contenedor">
      <form id="formulario-busqueda" class="formulario" role="search">
        <label for="campo-nombre">Nombre del personaje</label>
        <div class="formulario-fila">
          <input
            type="search"
            id="campo-nombre"
            name="nombre"
            placeholder="Por ejemplo: Rick, Morty, Summer"
            autocomplete="off"
            maxlength="40"
          />
          <button type="submit" id="boton-buscar">Buscar</button>
        </div>

        <div class="formulario-filtros">
          <div class="filtro">
            <label for="filtro-estado">Estado</label>
            <select id="filtro-estado" name="estado">
              <option value="">Todos</option>
              <option value="alive">Vivo</option>
              <option value="dead">Muerto</option>
              <option value="unknown">Desconocido</option>
            </select>
          </div>

          <div class="filtro">
            <label for="filtro-genero">Género</label>
            <select id="filtro-genero" name="genero">
              <option value="">Todos</option>
              <option value="female">Femenino</option>
              <option value="male">Masculino</option>
              <option value="genderless">Sin género</option>
              <option value="unknown">Desconocido</option>
            </select>
          </div>
        </div>
      </form>

      <p id="mensaje-estado" class="mensaje" role="status" aria-live="polite">
        Escribe un nombre o elige un filtro y presiona «Buscar».
      </p>

      <p id="contador-resultados" class="contador" aria-live="polite" hidden></p>

      <section id="contenedor-resultados" class="resultados" aria-label="Resultados de la búsqueda"></section>
    </main>

    <footer class="pie">
      Fuente de datos:
      <a href="https://rickandmortyapi.com/" target="_blank" rel="noopener noreferrer">The Rick and Morty API</a>
    </footer>
  </body>
</html>
